[project]
name = "tracefinity"
version = "0.1.0"
description = "Self-hosted tooltrace.ai clone - photo to gridfinity/foam cutouts"
requires-python = ">=3.10,<3.13"
dependencies = [
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.30.0,<0.35",
    "python-multipart>=0.0.9,<0.1",
    "opencv-python-headless>=4.10.0,<4.12",
    "numpy>=1.26,<2.2",
    "pillow>=10.0,<12",
    "build123d>=0.11.0,<0.12",
    "ezdxf>=1.1,<1.5",
    "trimesh>=4.4,<5",
    "networkx>=3.0,<4",
    "lxml>=4.9,<6",
    "numpy-stl>=2.17,<3",
    "sqlmodel>=0.0.22,<0.1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "ultralytics>=8.2,<9",
    "torch>=2.7.1,<2.8",
    "torchvision>=0.22.1,<0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.25",
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
